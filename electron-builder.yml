# Packaging: npm run build && npm run dist
appId: com.fastchat.desktop
productName: FastChat
copyright: Copyright © 2026 Andrea Porcella
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - drizzle/**
  - packs/**
  - package.json
asar: true
# Nessun modulo nativo (SQLite è node:sqlite, integrato in Electron): niente rebuild.
npmRebuild: false
mac:
  target: dmg
  category: public.app-category.productivity
  # Firma ad-hoc (gratuita, senza account Apple Developer): senza nessuna firma macOS su Apple
  # Silicon segnala l'app scaricata come «danneggiata». Con la firma ad-hoc compare invece il
  # normale avviso «sviluppatore non identificato», superabile con clic destro → Apri.
  # L'hardened runtime va disattivato con la firma ad-hoc, altrimenti l'app non si avvia.
  identity: '-'
  hardenedRuntime: false
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
win:
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-Setup-${version}.${ext}
linux:
  target: AppImage
  category: Utility
  maintainer: Andrea Porcella
appImage:
  artifactName: ${productName}-${version}-${arch}.${ext}
