# Build degli installer e pubblicazione della release.
#
# - Push di un tag "v*" (es. v0.2.0): test, build su macOS/Windows/Linux e Release GitHub
#   con gli installer allegati. La versione dell'app viene presa dal tag.
#   Un tag con trattino (es. v0.2.0-beta.1) crea una pre-release.
# - Avvio manuale (Actions → Release → Run workflow):
#   - con "version" compilato (es. 0.2.0): come sopra, e il workflow crea anche il tag v0.2.0
#     sul commit scelto;
#   - con "version" vuoto: solo build, gli installer restano come artifact del run;
#   - con "skip_macos": niente build macOS (es. se i runner macOS di GitHub sono in coda),
#     la release esce con i soli installer Windows e Linux.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versione da pubblicare, senza "v" (es. 0.2.0). Vuoto = solo build, nessuna release.'
        required: false
        default: ''
      skip_macos:
        description: 'Salta la build macOS (release con i soli installer Windows e Linux).'
        type: boolean
        required: false
        default: false

env:
  # Tag della release: dal push del tag, oppure "v" + la versione indicata nell'avvio manuale.
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || (inputs.version && format('v{0}', inputs.version)) || '' }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Typecheck e test
    runs-on: ubuntu-latest
    steps:
      - name: Controllo della versione
        if: env.RELEASE_TAG != ''
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Versione non valida: $RELEASE_TAG (atteso es. v1.2.3 o v1.2.3-beta.1)"
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    name: Build (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        # Elenco dinamico: con skip_macos la build macOS non viene nemmeno accodata.
        # (exclude non basterebbe: non rimuove le voci aggiunte con include.)
        name: ${{ fromJSON(inputs.skip_macos && '["Windows","Linux"]' || '["macOS","Windows","Linux"]') }}
    runs-on: ${{ matrix.name == 'macOS' && 'macos-latest' || matrix.name == 'Windows' && 'windows-latest' || 'ubuntu-latest' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Versione dal tag
        if: env.RELEASE_TAG != ''
        run: npm version "${RELEASE_TAG#v}" --no-git-tag-version --allow-same-version

      - name: Build
        run: npx electron-vite build

      - name: Installer
        # Installer non firmati: niente ricerca di certificati sul runner.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          TARGET: ${{ matrix.name == 'macOS' && '--mac --arm64 --x64' || matrix.name == 'Windows' && '--win --x64' || '--linux --x64' }}
        run: npx electron-builder $TARGET --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
          if-no-files-found: error
          retention-days: 14

  release:
    name: Pubblica la release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: installer-*
          merge-multiple: true

      - run: ls -la artifacts

      - uses: softprops/action-gh-release@v2
        with:
          # Se il tag non esiste (avvio manuale) viene creato sul commit di questo run.
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: FastChat ${{ env.RELEASE_TAG }}
          files: artifacts/*
          body: ${{ inputs.skip_macos && 'Questa release non include gli installer per macOS.' || '' }}
          generate_release_notes: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          fail_on_unmatched_files: true
