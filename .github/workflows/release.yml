# Build degli installer e pubblicazione della release.
#
# - Push di un tag "v*" (es. v0.2.0): test, build su macOS/Windows/Linux e Release GitHub
#   con gli installer allegati. La versione dell'app viene presa dal tag.
#   Un tag con trattino (es. v0.2.0-beta.1) crea una pre-release.
# - Avvio manuale (Actions → Release → Run workflow): solo build, gli installer
#   restano come artifact del run, senza creare una release.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Typecheck e test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    name: Build (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            target: --mac --arm64 --x64
          - name: Windows
            os: windows-latest
            target: --win --x64
          - name: Linux
            os: ubuntu-latest
            target: --linux --x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Versione dal tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Build
        run: npx electron-vite build

      - name: Installer
        # Installer non firmati: niente ricerca di certificati sul runner.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder ${{ matrix.target }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
          if-no-files-found: error
          retention-days: 14

  release:
    name: Pubblica la release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: installer-*
          merge-multiple: true

      - run: ls -la artifacts

      - uses: softprops/action-gh-release@v2
        with:
          name: FastChat ${{ github.ref_name }}
          files: artifacts/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
